query BattleState {
  gameState {
    notifications_count
    tools {
      attack {
        total_available_count
        tool {
          identifier
        }
      }
    }
  }
}

mutation UseTool($tool: String!, $targetUserId: Int) {
  useTool(tool_identifier: $tool, target_user_id: $targetUserId) {
    message
    interactions {
      id
    }
  }
}

query IncomingAttacks {
  me {
    id
  }
  gameState {
    pending_interactions {
      id
      type
      status
      tool_duration
      created_at_iso
      source_user {
        login
      }
      target_user {
        id
      }
      tool {
        name
      }
      messages {
        male {
          message
          pronoun
        }
        default {
          message
          pronoun
        }
      }
    }
  }
}
